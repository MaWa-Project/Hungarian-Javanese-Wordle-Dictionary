<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hungarian-Javanese Wordle Dictionary - Wordle</title>
    <link rel="stylesheet" type="text/css" href="style/nav.css">
	<link rel="stylesheet" type="text/css" href="style/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.png">
</head>
<body>
    <nav>
        <button onclick="window.location.href='index.html'">← Home</button>
        <button onclick="window.location.href='hungarian.html'">↔ Hungarian Wordle</button>
    </nav>
    <div class="columns">
        <div class="main-content column-left">
            <div class="content-card">
                <header>
                    <div id="wordle-title"></div>
                    <h1 id="title">Game - Javanese</h1>
                    <p>Guess the 5-letter Javanese word in 6 tries:</p>
                </header>
                <div id="game-board"></div>
                <button id="reset-btn" class="reset-btn">Reset Game</button>
                <footer>
                    <div id="color-info"></div>
                    <div id="wordle-info"></div>
                </footer>
            </div>
        </div>
        <div class="main-content column-right">
            <div class="content-card">
                <details>
                    <summary>Show possible words (Spoiler):</summary>
                    <div id="word-list"></div>
                </details>
            </div>
        </div>
    </div>

    <script src="script/title.js"></script>
    <script src="script/colorinfo.js"></script>
    <script type="module" src="script/wordle-base.js"></script>
    <script type="module" src="script/javanese.js"></script>
    <script type="module">
        import { JavaneseWordle } from "./script/javanese.js";

        const game = new JavaneseWordle();
        window.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('keydown', (e) => game.handleKey(e));
            game.initGame();
        });
    </script>
</body>
</html>
