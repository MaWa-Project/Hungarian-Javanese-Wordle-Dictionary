<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hungarian-Javanese Wordle Dictionary - Wordle</title>
    <link rel="stylesheet" type="text/css" href="style/nav.css">
	<link rel="stylesheet" type="text/css" href="style/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.png">
</head>
<body>
    <nav>
        <button onclick="window.location.href='index.html'"><div id="wordle-title"></div></button>
        <button onclick="window.location.href='javanese.html'">↔ Javanese Wordle</button>
    </nav>
    <div class="columns">
        <div class="main-content column-left">
            <div class="content-card">
                <header>
                    <div id="wordle-title"></div>
                    <h1>Game - Hungarian</h1>
                    <p>Guess the 5-letter Hungarian word in 6 tries:</p>
                </header>
                <div id="game-board"></div>
                <div class="buttons"><button id="reset-btn" class="reset-btn">Reset Game</button></div>
                <footer>
                    <details>
                        <summary>Keyboard:</summary>
                        <div id="keyboard" class="keyboard"></div>
                    </details>
                    <details>
                        <summary>How to Use:</summary>
                        <div id="color-info"></div>
                        <div id="wordle-info"></div>
                    </details>
                </footer>
            </div>
        </div>
        <div class="main-content column-right">
            <div class="content-card">
                <details>
                    <summary>Show Possible Words (Spoiler):</summary>
                    <div id="word-list"></div>
                </details>
            </div>
        </div>
    </div>

    <script src="script/title.js"></script>
    <script src="script/colorinfo.js"></script>
    <script type="module" src="script/wordle-base.js"></script>
    <script type="module" src="script/hungarian.js"></script>
    <script type="module">
        import { HungarianWordle } from "./script/hungarian.js";

        const game = new HungarianWordle();
        window.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('keydown', (e) => game.handleKey(e));
            game.initGame();
        });
    </script>
</body>
</html>
