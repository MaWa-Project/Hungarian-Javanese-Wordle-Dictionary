<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wordle Solver - Grid Mode</title>
    <style>
        .solver-board { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }
        .solver-row { display: flex; gap: 5px; }
        .solver-box {
            width: 60px; height: 45px;
            line-height: 45px; text-align: center; 
            border: 2px solid #3a3a3c;
            cursor: pointer; user-select: none; 
            color: white; font-weight: bold; font-size: 1.5rem;
            background-color: #121213;
            text-transform: uppercase;
        }
        .solver-box.active { border-color: #818384; }
        .solver-box.filled { color: white; border-color: #565758; }
    </style>
</head>
<body>
    <button onclick="window.location.href='index.html'">← Home</button>
    <button id="language-changer" onclick="window.location.href='index.html'">↔ ... Solver</button>
    <hr>
    <h1 id="solver-title">Wordle Solver</h1>
    
    <div id="solver-board" class="solver-board"></div>
    <hr>
    <div id="possible-words">
        <p>Loading dictionary...</p>
    </div>

    <script src="script/wordle-base.js"></script>
    <script src="script/hungarian.js"></script>
    <script src="script/javanese.js"></script>
    <script src="script/solver.js"></script>
</body>
</html>
