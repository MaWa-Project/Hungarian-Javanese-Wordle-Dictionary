<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hungarian-Javanese Wordle Dictionary</title>
</head>
<body>
    <h1>Hungarian-Javanese</h1>
    <h2>Wordle Dictionary</h2>
    <p>Select the language of the word you are looking for:</p>
    
    <div id="hungarian-wordle">
        <button onclick="window.location.href='hungarian.html'">Magyar (Hungarian) Wordle</button>
    </div>
    <div id="javanese-wordle">
        <button onclick="window.location.href='javanese.html'">Jawa (Javanese) Wordle</button>
    </div>
    <div id="hungarian-wordle-solver">
        <button onclick="window.location.href='solver.html?lang=hungarian'">Magyar (Hungarian) Solver</button>
    </div>
    <div id="javanese-wordle-solver">
        <button onclick="window.location.href='solver.html?lang=javanese'">Jawa (Javanese) Solver</button>
    </div>
    <div id="hungarian-dictionary">
        <button onclick="window.location.href='dictionary.html?lang=hungarian'">Magyar (Hungarian) Dictionary</button>
    </div>
    <div id="javanese-dictionary">
        <button onclick="window.location.href='dictionary.html?lang=javanese'">Jawa (Javanese) Dictionary</button>
    </div>
</body>
</html>
